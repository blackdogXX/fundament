version: '3.8'
services:
  fundament:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      # Почтовый сервер живёт на хосте, а не в этой compose-сети.
      # Имя должно совпадать с именем в TLS-сертификате docker-mailserver.
      - "${SMTP_HOST:-mail.ipa-constructing.org}:host-gateway"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - APP_BASE_URL=${APP_BASE_URL:-https://fundament-app.ru}
      - REQUIRE_CONFIRMED_EMAIL=${REQUIRE_CONFIRMED_EMAIL:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Fundament}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_ALLOW_INVALID_CERT=${SMTP_ALLOW_INVALID_CERT:-false}
    restart: unless-stopped
